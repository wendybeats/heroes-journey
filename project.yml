name: HeroesJourney
options:
  bundleIdPrefix: dev.heroesjourney
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
# HeroDomain and HeroContent are built here as framework targets from the same sources the
# Swift package uses (Package.swift stays for `swift test` and Linux CI). A local package at the
# project root made Xcode report "Missing package product" after regeneration; targets do not.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Simulator builds never need a signing team; device builds still use automatic signing.
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
targets:
  HeroDomain:
    type: framework
    platform: iOS
    sources: [Sources/HeroDomain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.heroesjourney.HeroDomain
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
  HeroContent:
    type: framework
    platform: iOS
    sources: [Sources/HeroContent]
    dependencies:
      - target: HeroDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.heroesjourney.HeroContent
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
  HeroesJourney:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # Folder references keep repo-relative paths so AppState/SpritePlayer resolve them 1:1.
      - path: Content
        type: folder
        buildPhase: resources
      - path: assets/sprites
        type: folder
        buildPhase: resources
      - path: App/Resources/Fonts
        buildPhase: resources
    dependencies:
      - target: HeroDomain
        embed: true
      - target: HeroContent
        embed: true
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Heroes Journey
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.heroesjourney.prototype
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
