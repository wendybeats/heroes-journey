name: HeroesJourney
options:
  bundleIdPrefix: dev.heroesjourney
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
# HeroDomain and HeroContent are built here as framework targets from the same sources the
# Swift package uses (Package.swift stays for `swift test` and Linux CI). A local package at the
# project root made Xcode report "Missing package product" after regeneration; targets do not.
packages:
  # HER-6: product analytics. The project key is public (write-only); see App/Sources/Analytics/PostHogAnalytics.swift.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.25.0"
  # HER-17: accounts and the server-side fact log. Publishable key only; see App/Sources/Backend/AccountSync.swift.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Simulator builds never need a signing team; device builds still use automatic signing.
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
targets:
  HeroDomain:
    type: framework
    platform: iOS
    sources: [Sources/HeroDomain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.heroesjourney.HeroDomain
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
  HeroContent:
    type: framework
    platform: iOS
    sources: [Sources/HeroContent]
    dependencies:
      - target: HeroDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.heroesjourney.HeroContent
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
  HeroesJourney:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # Folder references keep repo-relative paths so AppState/SpritePlayer resolve them 1:1.
      - path: Content
        type: folder
        buildPhase: resources
      - path: assets/sprites
        type: folder
        buildPhase: resources
      - path: App/Resources/Fonts
        buildPhase: resources
      # docs/46: the asset catalog holds the app icon (a placeholder composed from the kit until the owner's icon art lands).
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: HeroDomain
        embed: true
      - target: HeroContent
        embed: true
      - package: PostHog
      - package: Supabase
    entitlements:
      path: App/Resources/HeroesJourney.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Heroes Journey
        NSHealthShareUsageDescription: Heroes Journey reads your workouts from Apple Health so they count toward your character without logging them twice. Health data is never used for advertising or sold.
        NSHealthUpdateUsageDescription: Heroes Journey does not write to Apple Health.
        UILaunchScreen: {}
        # docs/46: HTTPS only, so no export-compliance question on every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.heroesjourney.prototype
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
